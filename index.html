<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172139" />
    <title>NEXUS MEMBER BOOK</title>
    <link rel="icon" href="./nexus-symbol.png" />
    <link rel="canonical" href="https://yuzuran0902-crypto.github.io/nexus-member-profile-page/" />
    <style>
      :root { color-scheme: light; --ink:#172139; --muted:#677089; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic",Arial,sans-serif; background:linear-gradient(125deg,#dff5ff 0%,#e9e5ff 28%,#ffe1ef 55%,#ffe7d8 76%,#fff3bd 100%); }
      body::before { content:""; position:fixed; width:34rem; height:34rem; left:-12rem; top:-12rem; background:url("./nexus-symbol.png") center/contain no-repeat; opacity:.12; transform:rotate(12deg); pointer-events:none; }
      body::after { content:""; position:fixed; width:26rem; height:26rem; right:-8rem; bottom:-9rem; border-radius:50%; background:#ed8fbd55; filter:blur(60px); pointer-events:none; }
      body.app-open { overflow:hidden; background:#fffdf6; }
      body.app-open::before,body.app-open::after { display:none; }
      main { position:relative; min-height:100vh; display:grid; place-items:center; padding:2.5rem 1.25rem; }
      main[hidden] { display:none; }
      #app-shell { position:fixed; inset:0; z-index:100; background:#fffdf6; }
      #app-shell[hidden] { display:none; }
      #app-frame { display:block; width:100%; height:100%; border:0; background:#fffdf6; }
      .card { width:min(100%,28rem); padding:2.5rem; border:1px solid #ffffffcc; border-radius:2.15rem; background:#fffffff0; box-shadow:0 30px 90px #1721392e; backdrop-filter:blur(18px); }
      .brand { display:flex; align-items:center; gap:.8rem; }
      .mark { width:3rem; height:3rem; padding:.45rem; border-radius:1rem; background:var(--ink); box-shadow:0 8px 20px #17213933; }
      .mark img { width:100%; height:100%; object-fit:contain; }
      .brand strong { display:block; letter-spacing:.14em; font-size:1.1rem; }
      .brand small { display:block; margin-top:.2rem; color:var(--muted); font-size:.65rem; font-weight:800; letter-spacing:.15em; }
      .lock { display:grid; place-items:center; width:3rem; height:3rem; margin-top:2rem; border-radius:1.05rem; color:white; font-size:1.3rem; background:linear-gradient(125deg,#56b8e7,#8c92e4 28%,#ed8fbd 55%,#ffa27e 78%,#ffd25e); }
      h1 { margin:1.2rem 0 0; font-size:2rem; line-height:1.15; letter-spacing:-.04em; }
      .lead { margin:.8rem 0 0; color:var(--muted); font-size:.9rem; font-weight:600; line-height:1.85; }
      form { margin-top:1.75rem; }
      label { display:block; margin-top:1rem; font-size:.82rem; font-weight:900; }
      input { width:100%; margin-top:.55rem; padding:.9rem 1rem; border:2px solid #1721391f; border-radius:1rem; background:#fafafa; color:var(--ink); font:inherit; font-size:.9rem; font-weight:700; outline:none; }
      input:focus { border-color:var(--ink); background:white; }
      .hint { margin:.55rem 0 0; padding:.8rem 1rem; border-radius:1rem; background:#fff1bd; font-size:.82rem; font-weight:800; line-height:1.6; }
      .hint strong { margin-right:.55rem; color:#c06a00; font-size:.7rem; letter-spacing:.12em; }
      .password-wrap { position:relative; display:block; margin-top:.55rem; }
      .password-wrap input { margin-top:0; padding-right:5.3rem; }
      .password-toggle { position:absolute; top:50%; right:.45rem; width:auto; padding:.55rem .7rem; border-radius:.7rem; color:var(--muted); background:#f0f1f3; font-size:.72rem; }
      .error { display:none; margin:1rem 0 0; padding:.8rem 1rem; border-radius:1rem; background:#fff0f3; color:#b73558; font-size:.82rem; font-weight:800; line-height:1.6; }
      .actions { display:grid; gap:.8rem; margin-top:1.25rem; }
      button { width:100%; padding:1rem; border:0; border-radius:1rem; font:inherit; font-weight:900; cursor:pointer; transition:transform .18s,opacity .18s; }
      button:hover { transform:translateY(-2px); }
      button:disabled { cursor:wait; opacity:.55; transform:none; }
      .login { color:white; background:linear-gradient(125deg,#56b8e7,#8c92e4 28%,#ed8fbd 55%,#ffa27e 78%,#ffd25e); box-shadow:0 12px 28px #8c92e444; }
      .divider { display:flex; align-items:center; gap:.75rem; color:#8a91a1; font-size:.72rem; font-weight:800; }
      .divider::before,.divider::after { content:""; flex:1; height:1px; background:#1721391a; }
      .create { border:2px solid var(--ink); background:white; color:var(--ink); }
      .note { margin:1rem 0 0; color:#8a91a1; font-size:.68rem; font-weight:700; text-align:center; }
      @media (max-width:480px) { .card { padding:1.75rem; border-radius:1.8rem; } h1 { font-size:1.75rem; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="login-title">
        <div class="brand"><span class="mark"><img src="./nexus-symbol.png" alt="" /></span><span><strong>NEXUS</strong><small>MEMBER BOOK</small></span></div>
        <div class="lock" aria-hidden="true">⌁</div>
        <h1 id="login-title">メンバーログイン</h1>
        <p class="lead">姓と名をつなげたフルネーム、またはあだ名でログインできます。</p>
        <form id="login-form">
          <label>フルネームまたはあだ名<input id="name" name="name" autocomplete="username" placeholder="例：中野結佳 / ぼるで" maxlength="80" required /></label>
          <label for="password">パスワード</label>
          <p class="hint"><strong>ヒント</strong>感情を出し、〇〇〇〇を生み出す</p>
          <span class="password-wrap"><input id="password" name="password" type="text" inputmode="text" lang="ja" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required /><button id="password-toggle" class="password-toggle" type="button" aria-label="パスワードを隠す">隠す</button></span>
          <p class="note">日本語入力・漢字変換に対応しています</p>
          <p id="error" class="error" role="alert"></p>
          <div class="actions">
            <button class="login" name="intent" value="home">ログイン</button>
            <div class="divider">初めての方</div>
            <button class="create" name="intent" value="edit">プロフィールを作る</button>
          </div>
          <p class="note">認証後、NEXUS MEMBER BOOKへ移動します。</p>
        </form>
      </section>
    </main>
    <section id="app-shell" aria-label="NEXUS MEMBER BOOK" hidden>
      <iframe id="app-frame" title="NEXUS MEMBER BOOK プロフィール画面" allow="web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
    <script>
      const API_ORIGIN = "https://nexus-member-profile-20261112.laborobo.chatgpt.site";
      const TOKEN_STORAGE_KEY = "nexus_member_token";
      const NAME_STORAGE_KEY = "nexus_member_name";
      const loginMain = document.querySelector("main");
      const appShell = document.getElementById("app-shell");
      const appFrame = document.getElementById("app-frame");
      const form = document.getElementById("login-form");
      const error = document.getElementById("error");
      const nameInput = document.getElementById("name");
      const passwordInput = document.getElementById("password");
      const passwordToggle = document.getElementById("password-toggle");
      const buttons = [...form.querySelectorAll("button")];
      const openApp = (token, displayName, view = "home") => {
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
        localStorage.setItem(NAME_STORAGE_KEY, displayName || "NEXUSメンバー");
        const fragment = new URLSearchParams({ token, name: displayName || "NEXUSメンバー", view });
        appFrame.src = `${API_ORIGIN}/#${fragment}`;
        loginMain.hidden = true;
        appShell.hidden = false;
        document.body.classList.add("app-open");
      };
      const closeApp = () => {
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        localStorage.removeItem(NAME_STORAGE_KEY);
        appFrame.src = "about:blank";
        appShell.hidden = true;
        loginMain.hidden = false;
        document.body.classList.remove("app-open");
        passwordInput.value = "";
        buttons.forEach((button) => { button.disabled = false; });
      };
      window.addEventListener("message", (event) => {
        if (event.origin === API_ORIGIN && event.data?.type === "nexus-logout") closeApp();
      });
      passwordToggle.addEventListener("click", () => {
        const visible = passwordInput.type === "text";
        passwordInput.type = visible ? "password" : "text";
        passwordToggle.textContent = visible ? "表示" : "隠す";
        passwordToggle.setAttribute("aria-label", visible ? "パスワードを表示する" : "パスワードを隠す");
        passwordInput.focus();
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.style.display = "none";
        buttons.forEach((button) => { button.disabled = true; });
        const intent = event.submitter?.value === "edit" ? "edit" : "home";
        try {
          const response = await fetch(`${API_ORIGIN}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: nameInput.value, password: passwordInput.value }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "ログインできませんでした");
          openApp(data.token, data.displayName, intent);
        } catch (loginError) {
          error.textContent = loginError instanceof Error ? loginError.message : "ログインできませんでした";
          error.style.display = "block";
          buttons.forEach((button) => { button.disabled = false; });
        }
      });
      const savedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
      if (savedToken) openApp(savedToken, localStorage.getItem(NAME_STORAGE_KEY) || "NEXUSメンバー");
    </script>
  </body>
</html>
